<!--
  newtab.html — 新标签页主页面

  页面结构 (自上而下):
  ┌─────────────────────────────────────┐
  │  #search-area   搜索栏（sticky）     │
  ├─────────────────────────────────────┤
  │  #bookmark-area 书签内容区           │
  │  ├── #layout-grid    卡片网格布局     │
  │  ├── #layout-sidebar 侧边栏布局      │
  │  └── #layout-rows   行布局（默认）    │
  ├─────────────────────────────────────┤
  │  #context-menu  右键菜单（fixed）     │
  │  #edit-overlay  编辑书签弹窗          │
  │  #settings-overlay 设置面板          │
  │  #settings-btn  设置悬浮按钮          │
  └─────────────────────────────────────┘

  JS 脚本加载顺序（有依赖关系，不可打乱）:
  1. utils.js       — 工具函数（createElement/getFaviconUrl/debounce）
  2. search.js      — 搜索（依赖 utils.createElement）
  3. bookmarks.js   — 书签渲染（依赖 utils + search.SEARCH_ENGINES）
  4. sync.js        — 同步（依赖 bookmarks.loadBookmarks）
  5. settings.js    — 设置（依赖 search.selectEngine + search.SEARCH_ENGINES）
  6. app.js         — 入口（调用以上所有模块的 init 函数）
-->
<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新标签页</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ========== 搜索栏区域（固定高度） ========== -->
    <header id="search-area">
      <div class="search-container">
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            placeholder="搜索书签或网页..."
            autocomplete="off"
            autofocus
          />
          <div class="engine-selector" id="engine-selector">
            <button id="engine-btn" title="切换搜索引擎">
              <img id="engine-icon" src="" alt="" />
              <span id="engine-name">Google</span>
              <svg
                class="arrow-icon"
                viewBox="0 0 24 24"
                width="14"
                height="14"
              >
                <path
                  d="M7 10l5 5 5-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <ul id="engine-list" class="engine-dropdown hidden"></ul>
          </div>
        </div>
        <!-- 搜索结果提示（过滤书签时显示） -->
        <div id="search-hint" class="search-hint hidden"></div>
      </div>
    </header>

    <!-- ========== 书签内容区 ========== -->
    <main id="bookmark-area">
      <!-- 布局 A: 平铺网格 -->
      <div id="layout-grid" class="bookmark-layout hidden"></div>
      <!-- 布局 B: 侧边栏模式 -->
      <div id="layout-sidebar" class="bookmark-layout hidden">
        <nav id="sidebar-nav" class="sidebar-nav"></nav>
        <section id="sidebar-content" class="sidebar-content"></section>
      </div>
      <!-- 布局 C: 行布局（默认） -->
      <div id="layout-rows" class="bookmark-layout active"></div>
    </main>

    <!-- ========== 右键菜单 ========== -->
    <div id="context-menu" class="context-menu hidden">
      <div class="context-menu-item" data-action="open">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path
            d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <polyline
            points="15 3 21 3 21 9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <line
            x1="10"
            y1="14"
            x2="21"
            y2="3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <span>打开链接</span>
      </div>
      <div class="context-menu-item" data-action="open-new">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M9 3v18M3 9h18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <span>新标签页打开</span>
      </div>
      <div class="context-menu-divider"></div>
      <div class="context-menu-item" data-action="edit">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <span>编辑书签</span>
      </div>
      <div class="context-menu-item" data-action="delete">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <polyline
            points="3 6 5 6 21 6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M10 11v6M14 11v6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <span>删除</span>
      </div>
    </div>

    <!-- ========== 编辑书签弹窗 ========== -->
    <div id="edit-overlay" class="settings-overlay hidden">
      <div class="settings-panel edit-panel">
        <div class="settings-header">
          <h2 id="edit-title">编辑书签</h2>
          <button id="edit-close" class="settings-close" title="关闭">
            &times;
          </button>
        </div>
        <div class="settings-body">
          <div class="setting-group">
            <label class="setting-label">标题</label>
            <input
              type="text"
              id="edit-name"
              class="setting-input"
              placeholder="书签名称"
            />
          </div>
          <div class="setting-group" id="edit-url-group">
            <label class="setting-label">网址</label>
            <input
              type="url"
              id="edit-url"
              class="setting-input"
              placeholder="https://..."
            />
          </div>
          <div class="edit-actions">
            <button id="edit-cancel" class="btn btn-secondary">取消</button>
            <button id="edit-save" class="btn btn-primary">保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== 设置浮层 ========== -->
    <div id="settings-overlay" class="settings-overlay hidden">
      <div class="settings-panel" style="width: 480px">
        <div class="settings-header">
          <h2>设置</h2>
          <button id="settings-close" class="settings-close" title="关闭">
            &times;
          </button>
        </div>
        <!-- Tab 导航 -->
        <div class="settings-tabs">
          <button class="settings-tab active" data-tab="appearance">
            外观
          </button>
          <button class="settings-tab" data-tab="layout">布局</button>
          <button class="settings-tab" data-tab="search">搜索引擎</button>
        </div>
        <div class="settings-body">
          <!-- Tab 1: 外观 -->
          <div class="settings-tab-content active" data-tab="appearance">
            <!-- 主题模式 -->
            <div class="setting-group">
              <label class="setting-label">主题模式</label>
              <div class="theme-options">
                <button class="theme-option active" data-theme="light">
                  <svg
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                  >
                    <circle cx="12" cy="12" r="5" />
                    <path
                      d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                    />
                  </svg>
                  <span>浅色</span>
                </button>
                <button class="theme-option" data-theme="dark">
                  <svg
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                  >
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                  </svg>
                  <span>深色</span>
                </button>
                <button class="theme-option" data-theme="auto">
                  <svg
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                  >
                    <rect x="2" y="3" width="20" height="14" rx="2" />
                    <path d="M8 21h8M12 17v4" />
                  </svg>
                  <span>跟随系统</span>
                </button>
              </div>
            </div>
            <!-- 配色方案 -->
            <div class="setting-group">
              <label class="setting-label">配色方案</label>
              <div class="color-options" id="color-options">
                <!-- JS 动态生成 -->
              </div>
            </div>
            <!-- 背景图 -->
            <div class="setting-group">
              <label class="setting-label">背景图</label>
              <div class="bg-options" id="bg-options">
                <!-- JS 动态生成 -->
              </div>
              <!-- URL 输入 -->
              <div class="bg-url-row">
                <input
                  type="url"
                  id="bg-url-input"
                  placeholder="输入图片网址..."
                />
                <button id="bg-url-apply">应用</button>
              </div>
              <!-- 上传按钮 -->
              <div class="bg-upload-row">
                <button class="bg-upload-btn" id="bg-upload-btn">
                  上传本地图片
                </button>
                <input
                  type="file"
                  id="bg-file-input"
                  accept="image/*"
                  style="display: none"
                />
              </div>
            </div>
          </div>

          <!-- Tab 2: 布局 -->
          <div class="settings-tab-content" data-tab="layout">
            <div class="setting-group">
              <label class="setting-label">布局模式</label>
              <div class="setting-options">
                <button class="layout-option active" data-layout="rows">
                  <svg viewBox="0 0 24 24" width="20" height="20">
                    <rect
                      x="2"
                      y="2"
                      width="20"
                      height="5"
                      rx="1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <rect
                      x="2"
                      y="9.5"
                      width="20"
                      height="5"
                      rx="1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <rect
                      x="2"
                      y="17"
                      width="20"
                      height="5"
                      rx="1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                  </svg>
                  <span>分行</span>
                </button>
                <button class="layout-option" data-layout="grid">
                  <svg viewBox="0 0 24 24" width="20" height="20">
                    <rect
                      x="2"
                      y="2"
                      width="9"
                      height="9"
                      rx="1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <rect
                      x="13"
                      y="2"
                      width="9"
                      height="9"
                      rx="1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <rect
                      x="2"
                      y="13"
                      width="9"
                      height="9"
                      rx="1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <rect
                      x="13"
                      y="13"
                      width="9"
                      height="9"
                      rx="1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                  </svg>
                  <span>卡片</span>
                </button>
                <button class="layout-option" data-layout="sidebar">
                  <svg viewBox="0 0 24 24" width="20" height="20">
                    <rect
                      x="2"
                      y="2"
                      width="7"
                      height="20"
                      rx="1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                    <rect
                      x="11"
                      y="2"
                      width="11"
                      height="20"
                      rx="1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    />
                  </svg>
                  <span>侧边栏</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Tab 3: 搜索引擎 -->
          <div class="settings-tab-content" data-tab="search">
            <div class="setting-group">
              <label class="setting-label">默认搜索引擎</label>
              <select id="setting-engine" class="setting-select"></select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== 设置按钮（右下角悬浮） ========== -->
    <button id="settings-btn" class="settings-btn" title="设置">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <path
          d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
      </svg>
    </button>

    <!-- ========== JS 模块（顺序有依赖，不可调换） ========== -->
    <!-- 1. 工具函数：createElement, getFaviconUrl, debounce, SVG图标 -->
    <script src="js/utils.js"></script>
    <!-- 1.5 主题管理：深浅切换 + 配色方案 + 背景图（需在所有UI初始化前加载） -->
    <script src="js/theme.js"></script>
    <!-- 2. 搜索：SEARCH_ENGINES 常量 + initSearch + filterBookmarks -->
    <script src="js/search.js"></script>
    <!-- 3. 书签核心：loadBookmarks + 三种布局渲染 + 右键菜单 + 编辑弹窗 -->
    <script src="js/bookmarks.js"></script>
    <!-- 4. 双向同步：Sync Lock + registerBookmarkListeners -->
    <script src="js/sync.js"></script>
    <!-- 5. 设置面板：布局切换 + 引擎选择 + 持久化 -->
    <script src="js/settings.js"></script>
    <!-- 6. 入口：DOMContentLoaded 后按顺序初始化各模块 -->
    <script src="js/app.js"></script>
  </body>
</html>
