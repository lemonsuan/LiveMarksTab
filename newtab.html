<!--
  newtab.html — LiveMarksTab 新标签页主页面 (v2 重构版)

  页面结构 (自上而下):
  ┌─────────────────────────────────────┐
  │  .hero           搜索区（居中）      │
  │  ├── .greeting   问候语             │
  │  └── .search-box 搜索框             │
  ├─────────────────────────────────────┤
  │  .quick-access   快速访问站点网格    │
  ├─────────────────────────────────────┤
  │  .bookmarks      书签内容区          │
  │  ├── #layout-grid    卡片网格布局    │
  │  ├── #layout-sidebar 侧边栏布局     │
  │  └── #layout-rows   行布局（默认）   │
  ├─────────────────────────────────────┤
  │  .toolbar-minimal   工具栏（右下角） │
  │  #context-menu      右键菜单        │
  │  #edit-overlay      编辑书签弹窗     │
  │  #settings-overlay  设置面板         │
  │  #qr-overlay        二维码弹窗       │
  │  #cleaner-overlay   书签清理面板     │
  └─────────────────────────────────────┘

  JS 脚本加载顺序（有依赖关系，不可打乱）:
  1. utils.js       — 工具函数
  2. theme.js       — 主题管理
  3. search.js      — 搜索功能
  4. qrcode.js      — 二维码生成
  5. bookmarks.js   — 书签渲染
  6. cleaner.js     — 书签清理
  7. sync.js        — 同步
  8. settings.js    — 设置面板
  9. app.js         — 入口
-->
<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新标签页</title>
    <!-- CSS 模块 -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/search.css" />
    <link rel="stylesheet" href="css/bookmarks.css" />
    <link rel="stylesheet" href="css/overlay.css" />
    <link rel="stylesheet" href="css/toolbar.css" />
  </head>
  <body>
    <!-- ========== Hero 搜索区域 ========== -->
    <main class="hero">
      <div class="greeting" id="greeting"></div>
      <div class="search-container">
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            placeholder="搜索书签或网页..."
            autocomplete="off"
            autofocus
          />
          <div class="engine-selector" id="engine-selector">
            <button id="engine-btn" title="切换搜索引擎">
              <img id="engine-icon" src="" alt="" />
              <span id="engine-name">Google</span>
              <svg
                class="arrow-icon"
                viewBox="0 0 24 24"
                width="14"
                height="14"
              >
                <path
                  d="M7 10l5 5 5-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <ul id="engine-list" class="engine-dropdown hidden"></ul>
          </div>
        </div>
        <!-- 搜索结果提示 -->
        <div id="search-hint" class="search-hint hidden"></div>
      </div>
    </main>

    <!-- ========== 快速访问 ========== -->
    <section class="quick-access" id="quick-access">
      <div class="site-grid" id="site-grid">
        <!-- JS 动态生成 -->
      </div>
    </section>

    <!-- ========== 书签内容区 ========== -->
    <section class="bookmarks">
      <!-- 布局 A: 卡片网格 -->
      <div id="layout-grid" class="bookmark-layout hidden"></div>
      <!-- 布局 B: 面包屑+平铺导航 -->
      <div id="layout-sidebar" class="bookmark-layout hidden">
        <nav id="sidebar-breadcrumb" class="sidebar-breadcrumb"></nav>
        <div id="sidebar-grid" class="sidebar-grid"></div>
      </div>
      <!-- 布局 C: 行布局（默认） -->
      <div id="layout-rows" class="bookmark-layout active"></div>
    </section>

    <!-- ========== 右键菜单 ========== -->
    <div id="context-menu" class="context-menu hidden">
      <div class="context-menu-item" data-action="open">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path
            d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <polyline
            points="15 3 21 3 21 9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <line
            x1="10"
            y1="14"
            x2="21"
            y2="3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <span>打开链接</span>
      </div>
      <div class="context-menu-item" data-action="open-new">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M9 3v18M3 9h18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <span>新标签页打开</span>
      </div>
      <div class="context-menu-divider"></div>
      <div class="context-menu-item" data-action="edit">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <span>编辑书签</span>
      </div>
      <div class="context-menu-item" data-action="qrcode">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <rect
            x="3"
            y="3"
            width="7"
            height="7"
            rx="1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <rect
            x="14"
            y="3"
            width="7"
            height="7"
            rx="1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <rect
            x="3"
            y="14"
            width="7"
            height="7"
            rx="1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <rect x="14" y="14" width="4" height="4" fill="currentColor" />
          <rect x="19" y="19" width="2" height="2" fill="currentColor" />
          <rect x="14" y="19" width="2" height="2" fill="currentColor" />
          <rect x="19" y="14" width="2" height="2" fill="currentColor" />
        </svg>
        <span>生成二维码</span>
      </div>
      <div class="context-menu-divider"></div>
      <div class="context-menu-item" data-action="delete">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <polyline
            points="3 6 5 6 21 6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M10 11v6M14 11v6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <span>删除</span>
      </div>
    </div>

    <!-- ========== 二维码弹窗 ========== -->
    <div id="qr-overlay" class="settings-overlay hidden">
      <div class="qr-panel">
        <div class="qr-panel-header">
          <span class="qr-panel-title">二维码</span>
          <button id="qr-close-btn" class="modal-close-btn">×</button>
        </div>
        <div class="qr-panel-body">
          <div class="qr-image-wrap">
            <canvas id="qr-canvas" width="200" height="200"></canvas>
          </div>
          <div class="qr-url" id="qr-url"></div>
          <div class="qr-actions">
            <button id="qr-copy-image" class="qr-action-btn">
              📋 复制二维码
            </button>
            <button id="qr-copy-url" class="qr-action-btn">🔗 复制网址</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== 编辑书签弹窗 ========== -->
    <div id="edit-overlay" class="settings-overlay hidden">
      <div class="settings-panel edit-panel">
        <div class="settings-header">
          <h2 id="edit-title">编辑书签</h2>
          <button id="edit-close" class="settings-close" title="关闭">
            &times;
          </button>
        </div>
        <div class="settings-body" style="padding: 20px">
          <div class="setting-group">
            <label class="setting-label">标题</label>
            <input
              type="text"
              id="edit-name"
              class="setting-input"
              placeholder="书签名称"
            />
          </div>
          <div class="setting-group" id="edit-url-group">
            <label class="setting-label">网址</label>
            <input
              type="url"
              id="edit-url"
              class="setting-input"
              placeholder="https://..."
            />
          </div>
          <div class="edit-actions">
            <button id="edit-cancel" class="btn btn-secondary">取消</button>
            <button id="edit-save" class="btn btn-primary">保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== 设置面板 ========== -->
    <div id="settings-overlay" class="settings-overlay hidden">
      <div class="settings-panel">
        <div class="settings-header">
          <h2>设置</h2>
          <button id="settings-close" class="settings-close" title="关闭">
            &times;
          </button>
        </div>
        <div class="settings-layout">
          <!-- 左侧 Tab 导航 -->
          <div class="settings-sidebar">
            <button class="settings-tab active" data-tab="appearance">
              外观
            </button>
            <button class="settings-tab" data-tab="layout">布局</button>
            <button class="settings-tab" data-tab="search">搜索引擎</button>
            <button class="settings-tab" data-tab="shortcuts">快捷入口</button>
            <div class="settings-sidebar-spacer"></div>
            <button
              id="btn-reset-settings"
              class="settings-reset-btn"
              title="重置所有设置"
            >
              重置设置
            </button>
          </div>
          <!-- 右侧内容区 -->
          <div class="settings-content">
            <!-- Tab 1: 外观 -->
            <div class="settings-tab-content active" data-tab="appearance">
              <!-- 配色方案 -->
              <div class="setting-group">
                <label class="setting-label">配色方案</label>
                <div class="color-options" id="color-options">
                  <!-- JS 动态生成 -->
                </div>
              </div>
              <!-- 背景图 -->
              <div class="setting-group">
                <label class="setting-label">背景图</label>
                <div class="bg-options" id="bg-options">
                  <!-- JS 动态生成 -->
                </div>
                <div class="bg-url-row">
                  <input
                    type="url"
                    id="bg-url-input"
                    placeholder="输入图片网址..."
                  />
                  <button id="bg-url-apply">应用</button>
                </div>
                <div class="bg-upload-row">
                  <button class="bg-upload-btn" id="bg-upload-btn">
                    上传本地图片
                  </button>
                  <input
                    type="file"
                    id="bg-file-input"
                    accept="image/*"
                    style="display: none"
                  />
                </div>
              </div>
            </div>

            <!-- Tab 2: 布局 -->
            <div class="settings-tab-content" data-tab="layout">
              <div class="setting-group">
                <label class="setting-label">布局模式</label>
                <div class="setting-options">
                  <button class="layout-option active" data-layout="rows">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                      <rect
                        x="2"
                        y="2"
                        width="20"
                        height="5"
                        rx="1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                      <rect
                        x="2"
                        y="9.5"
                        width="20"
                        height="5"
                        rx="1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                      <rect
                        x="2"
                        y="17"
                        width="20"
                        height="5"
                        rx="1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                    </svg>
                    <span>分行</span>
                  </button>
                  <button class="layout-option" data-layout="grid">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                      <rect
                        x="2"
                        y="2"
                        width="9"
                        height="9"
                        rx="1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                      <rect
                        x="13"
                        y="2"
                        width="9"
                        height="9"
                        rx="1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                      <rect
                        x="2"
                        y="13"
                        width="9"
                        height="9"
                        rx="1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                      <rect
                        x="13"
                        y="13"
                        width="9"
                        height="9"
                        rx="1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                    </svg>
                    <span>卡片</span>
                  </button>
                  <button class="layout-option" data-layout="sidebar">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                      <rect
                        x="2"
                        y="2"
                        width="7"
                        height="20"
                        rx="1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                      <rect
                        x="11"
                        y="2"
                        width="11"
                        height="20"
                        rx="1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                    </svg>
                    <span>侧边栏</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Tab 3: 搜索引擎 -->
            <div class="settings-tab-content" data-tab="search">
              <div class="setting-group">
                <label class="setting-label">默认搜索引擎</label>
                <select id="setting-engine" class="setting-select"></select>
              </div>
              <div class="setting-group">
                <label class="setting-label"
                  >多引擎搜索
                  <span class="setting-hint">Shift+Enter 同时搜索</span></label
                >
                <div id="multi-engine-list" class="multi-engine-list">
                  <!-- JS 动态生成 -->
                </div>
              </div>
            </div>

            <!-- Tab 4: 快捷入口 -->
            <div class="settings-tab-content" data-tab="shortcuts">
              <div class="setting-group">
                <label class="setting-label">Chrome 快捷入口</label>
                <div class="shortcut-grid" id="shortcut-grid">
                  <!-- JS 动态生成 -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== 浮动工具栏（右下角竖排） ========== -->
    <div class="toolbar-minimal">
      <!-- 深浅切换 -->
      <button id="btn-theme-toggle" class="float-btn" title="深浅切换">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="5" />
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      </button>
      <!-- 密码管理 -->
      <button id="btn-passwords" class="float-btn" title="密码管理">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </button>
      <!-- 浏览历史 -->
      <button id="btn-history" class="float-btn" title="浏览历史">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      </button>
      <!-- 扩展管理 -->
      <button id="btn-extensions" class="float-btn" title="扩展管理">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
      </button>
      <!-- 书签清理 -->
      <button id="btn-cleaner" class="float-btn" title="书签清理">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 2l.27 1.63A7 7 0 0 0 5.16 7H3v2h1.29a7 7 0 0 0 0 6H3v2h2.16a7 7 0 0 0 4.11 3.37L9 22h6l-.27-1.63A7 7 0 0 0 18.84 17H21v-2h-1.29a7 7 0 0 0 0-6H21V7h-2.16a7 7 0 0 0-4.11-3.37L15 2H9z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      <!-- 设置 -->
      <button id="btn-settings" class="float-btn" title="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>

    <!-- ========== 书签清理面板 ========== -->
    <div id="cleaner-overlay" class="settings-overlay hidden">
      <div class="cleaner-panel">
        <div class="cleaner-panel-header">
          <span class="cleaner-panel-title">书签可访问性检测</span>
          <button id="cleaner-close-btn" class="modal-close-btn">×</button>
        </div>
        <div id="cleaner-stats" class="cleaner-stats" style="display: none">
          <div class="cleaner-stat-card">
            <span class="cleaner-stat-num" id="cleaner-stat-total">—</span>
            <span class="cleaner-stat-label">总书签</span>
          </div>
          <div class="cleaner-stat-card ok">
            <span class="cleaner-stat-num" id="cleaner-stat-ok">—</span>
            <span class="cleaner-stat-label">正常</span>
          </div>
          <div class="cleaner-stat-card error">
            <span class="cleaner-stat-num" id="cleaner-stat-error">—</span>
            <span class="cleaner-stat-label">不可访问</span>
          </div>
          <div class="cleaner-stat-card timeout">
            <span class="cleaner-stat-num" id="cleaner-stat-timeout">—</span>
            <span class="cleaner-stat-label">超时</span>
          </div>
        </div>
        <div class="cleaner-panel-body">
          <button id="cleaner-start" class="cleaner-start-btn">
            开始扫描所有书签
          </button>
          <div
            id="cleaner-progress"
            class="cleaner-progress"
            style="display: none"
          >
            <div class="cleaner-progress-bar">
              <div
                id="cleaner-progress-fill"
                class="cleaner-progress-fill"
              ></div>
            </div>
            <span id="cleaner-progress-text" class="cleaner-progress-text"
              >0 / 0</span
            >
          </div>
          <div
            id="cleaner-filter-bar"
            class="cleaner-filter-bar"
            style="display: none"
          >
            <button class="cleaner-filter-btn active" data-filter="all">
              全部异常 <span class="filter-count">0</span>
            </button>
            <button class="cleaner-filter-btn" data-filter="error">
              不可访问 <span class="filter-count">0</span>
            </button>
            <button class="cleaner-filter-btn" data-filter="timeout">
              超时 <span class="filter-count">0</span>
            </button>
          </div>
          <div id="cleaner-results" class="cleaner-results"></div>
          <div id="cleaner-empty" class="cleaner-empty" style="display: none">
            所有书签均可正常访问！
          </div>
        </div>
        <div
          id="cleaner-bottom-bar"
          class="cleaner-bottom-bar"
          style="display: none"
        >
          <div class="cleaner-quick-select">
            <span class="cleaner-quick-label">快捷选择：</span>
            <button id="cleaner-select-all" class="cleaner-quick-btn">
              全选
            </button>
            <button id="cleaner-deselect-all" class="cleaner-quick-btn">
              取消全选
            </button>
            <button
              id="cleaner-select-error"
              class="cleaner-quick-btn error-btn"
            >
              仅不可访问
            </button>
            <button
              id="cleaner-select-timeout"
